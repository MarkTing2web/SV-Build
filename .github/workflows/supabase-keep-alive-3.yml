name: Supabase Keep-Alive Ping

on:
  schedule:
    - cron: '0 2 */3 * *'   # Every 3 days at 2am UTC (10am Singapore time)
  workflow_dispatch:          # Manual trigger from Actions tab

jobs:
  ping_supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Ping booking_submissions
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/booking_submissions?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Content-Type: application/json"
        continue-on-error: true

      - name: Ping proposal_submissions
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/proposal_submissions?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Content-Type: application/json"
        continue-on-error: true

      - name: Confirm ping
        run: echo "Supabase keep-alive ping completed at $(date)"