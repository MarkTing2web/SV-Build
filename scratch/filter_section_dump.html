<section class="filter-section" style="margin-top: 48px;">
        <div class="container">
            <p style="font-size: 0.9rem; color: #64748b; margin-bottom: 24px;">Refine project case studies by property type, system, or year:</p>
            <div class="filter-bar">
                <!-- Search -->
                <div class="filter-item search">
                    <input type="text" id="pSearch" placeholder="Search projects..." onkeyup="filterP()">
                </div>
                <!-- Property -->
                <div class="filter-item">
                    <select id="fProp" onchange="filterP()">
                        <option value="all">All Property Types</option>
                        <option value="Residential">Residential</option>
                        <option value="Condominiums">Condominiums</option>
                        <option value="Commercial">Commercial</option>
                        <option value="Industrial">Industrial</option>
                        <option value="Institutions">Institutions</option>
                        <option value="Healthcare">Healthcare</option>
                        <option value="Managed Living">Managed Living</option>
                        <option value="Data Centres">Data Centres</option>
                    </select>
                </div>
                <!-- System -->
                <div class="filter-item">
                    <select id="fSys" onchange="filterP()">
                        <option value="all">All System Types</option>
                        <option value="Premises Security">Premises Security</option>
                        <option value="Entry &amp; Access">Entry &amp; Access</option>
                        <option value="Vehicle Management">Vehicle Management</option>
                        <option value="Platform &amp; Management">Platform &amp; Management</option>
                    </select>
                </div>
                <!-- Year -->
                <div class="filter-item">
                    <select id="fYear" onchange="filterP()">
                        <option value="all">All Years</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2019">2019</option>
                        <option value="2017">2017</option>
                    </select>
                </div>
                <!-- Sort -->
                <div class="filter-item">
                    <select id="pSort" onchange="sortP()">
                        <option value="new">Newest First</option>
                        <option value="old">Oldest First</option>
                        <option value="az">Type (A-Z)</option>
                    </select>
                </div>
            </div>
        </div>
    </section>
